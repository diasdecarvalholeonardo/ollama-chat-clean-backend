server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/ollama_chat
spring.datasource.username=ollama_user
spring.datasource.password=ollama_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.data.mongodb.uri=mongodb://mongo:27017/ollama_chat

ollama.base-url=http://ollama:11434
ollama.model=llama3

logging.level.root=INFO
logging.level.com.leo.ai=INFO