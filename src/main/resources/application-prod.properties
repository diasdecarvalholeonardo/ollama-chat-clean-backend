server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/ollama_chat
spring.datasource.username=ollama_user
spring.datasource.password=ollama_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.data.mongodb.uri=mongodb://mongo:27017/ollama_chat

spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.vectorstore.pgvector.initialize-schema=true

rag.chunk.size=800
rag.chunk.overlap=150
rag.retrieval.top-k=5

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.ai=INFO
logging.level.com.leo.ai=INFO