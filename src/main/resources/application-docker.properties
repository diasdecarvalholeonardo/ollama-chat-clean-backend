spring.datasource.url=jdbc:postgresql://postgres:5432/ollama_db
spring.datasource.username=ollama_user
spring.datasource.password=ollama_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.mongodb.uri=mongodb://mongo:27017/ollama_db

spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.vectorstore.pgvector.initialize-schema=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web=INFO