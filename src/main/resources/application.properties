# PROFILE
spring.profiles.active=default

# SERVER
server.port=8080

# POSTGRES
spring.datasource.url=jdbc:postgresql://localhost:5432/ollama_db
spring.datasource.username=ollama_user
spring.datasource.password=ollama_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MONGODB
spring.data.mongodb.uri=mongodb://localhost:27017/ollama_db

# OLLAMA
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.model=llama3

# LOGGING
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.leo.ai=INFO