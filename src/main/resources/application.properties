# ====================================================================
# 1. CONFIGURAÇÃO GERAL
# ====================================================================
server.port=8080
spring.application.name=ollama-agentic-ai-orchestrator

# ====================================================================
# 2. CONFIGURAÇÃO LLM (OLLAMA / GEMMA)
# A URL é resolvida via Docker (ollama) ou localhost em modo dev
# ====================================================================
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=gemma:3b
spring.ai.ollama.chat.options.temperature=0.7
# Exemplo de extensões futuras:
# spring.ai.ollama.chat.options.top-p=0.9
# spring.ai.ollama.chat.options.top-k=40

# ====================================================================
# 3. POSTGRESQL
# ====================================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:postgres_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ====================================================================
# 4. VECTOR STORE (PGVECTOR)
# ====================================================================
spring.ai.vectorstore.pgvector.table-name=agent_knowledge_base
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimension=384

# ====================================================================
# 5. MONGODB
# Host padrão é "mongo" no Docker ou localhost em dev
# ====================================================================
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=27017
spring.data.mongodb.database=${MONGO_DB:agentic_db}

# ====================================================================
# 6. CONFIGURAÇÃO DAS TOOLS E SERVIÇOS EXTERNOS
# ====================================================================

# n8n (AutomationAgentTool)
tool.automation.n8n-base-url=${N8N_WEBHOOK_BASE_URL:http://localhost:5678}

# Exemplo: serviço externo (PIM / GraphQL)
tool.pim.graphql-endpoint=${PIM_GRAPHQL_ENDPOINT:http://pim-service:8082/graphql}
