spring.profiles.active=default

server.port=8080

ollama.model=gemma:2b
ollama.base-url=http://localhost:11434

spring.datasource.url=jdbc:postgresql://localhost:5432/ollama_db
spring.datasource.username=ollama_user
spring.datasource.password=ollama_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=OllamaHikariCP

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.data.mongodb.uri=mongodb://localhost:27017/ollama_db

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=gemma:2b
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.vectorstore.pgvector.initialize-schema=true

rag.chunk.size=800
rag.chunk.overlap=150
rag.retrieval.top-k=5

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.com.leo.ai=DEBUG

management.endpoints.web.exposure.include=health,mappings
management.endpoint.health.show-details=always

rag.fusion.cache-weight=1.2
rag.fusion.retrieval-weight=1.0
rag.fusion.rerank-weight=1.0

rag.cache.strong-threshold=0.92
rag.cache.weak-threshold=0.80
rag.cache.decay-hours=24

rag.ranking.min-score=0.15