services:

  postgres:
    image: postgres:16
    container_name: ollama_postgres
    environment:
      POSTGRES_DB: ollama_db
      POSTGRES_USER: ollama_user
      POSTGRES_PASSWORD: ollama_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ollama_network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ollama_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ollama_network
    restart: unless-stopped

networks:
  ollama_network:

volumes:
  postgres_data:
  mongo_data: